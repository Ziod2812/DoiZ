$font   = JetBrainsMono Nerd Font
$text   = rgba(205, 214, 244, 1.0)
$subtle = rgba(166, 173, 200, 1.0)
$accent = rgba(137, 180, 250, 0.85)
$glass  = rgba(30, 30, 46, 0.72)

general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = false
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    color = rgba(30, 30, 46, 1.0)
    blur_passes = 3
    blur_size = 8
    brightness = 0.8
}

label {
    monitor =
    text = Welcome!
    color = $subtle
    font_size = 22
    font_family = $font
    position = 0, 320
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date '+%H:%M')</b>"
    color = $text
    font_size = 84
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.45)
    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %d %B')"
    color = $subtle
    font_size = 18
    font_family = $font
    shadow_passes = 2
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.45)
    position = 0, 180
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.face
    size = 110
    rounding = -1
    border_size = 2
    border_color = $accent
    reload_time = 5
    reload_cmd = echo ~/.face
    position = 0, 60
    halign = center
    valign = center
}

shape {
    monitor =
    size = 320, 46
    color = $glass
    rounding = 14
    border_size = 2
    border_color = $accent
    position = 0, -30
    halign = center
    valign = center
}

label {
    monitor =
    text =   $USER
    color = $text
    font_size = 15
    font_family = $font
    position = 0, -30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 46
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = $accent
    inner_color = $glass
    font_color = $text
    font_family = $font
    fade_on_empty = false
    rounding = 14
    check_color = rgba(166, 227, 161, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    placeholder_text = <span foreground="##a6adc8">  Password</span>
    hide_input = false
    position = 0, -86
    halign = center
    valign = center
}

label {
    monitor =
    text = Press Enter to unlock
    color = $subtle
    font_size = 12
    font_family = $font
    position = 0, -135
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.config/hypr/empty.png
    size = 96
    rounding = 16
    border_size = 2
    border_color = $accent
    reload_time = 2
    reload_cmd = $HOME/.config/hypr/scripts/lock-media.sh cover
    position = -260, -235
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] $HOME/.config/hypr/scripts/lock-media.sh title
    color = $text
    font_size = 15
    font_family = $font
    position = 0, -195
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] $HOME/.config/hypr/scripts/lock-media.sh artist
    color = $subtle
    font_size = 12
    font_family = $font
    position = 0, -222
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:500] $HOME/.config/hypr/scripts/lock-media.sh icon-prev
    onclick = $HOME/.config/hypr/scripts/lock-media.sh prev
    color = $text
    font_size = 26
    font_family = $font
    position = -90, -275
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:500] $HOME/.config/hypr/scripts/lock-media.sh icon-play
    onclick = $HOME/.config/hypr/scripts/lock-media.sh toggle
    color = $text
    font_size = 26
    font_family = $font
    position = -30, -275
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:500] $HOME/.config/hypr/scripts/lock-media.sh icon-next
    onclick = $HOME/.config/hypr/scripts/lock-media.sh next
    color = $text
    font_size = 26
    font_family = $font
    position = 30, -275
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:500] $HOME/.config/hypr/scripts/lock-media.sh icon-loop
    onclick = $HOME/.config/hypr/scripts/lock-media.sh loop
    color = $text
    font_size = 26
    font_family = $font
    position = 90, -275
    halign = center
    valign = center
}

label {
    monitor =
    text = Session: Hyprland (Wayland)
    color = $subtle
    font_size = 12
    font_family = $font
    position = 0, 30
    halign = center
    valign = bottom
}
